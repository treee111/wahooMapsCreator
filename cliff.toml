# git-cliff configuration (https://git-cliff.org)
# Regenerate: npm run changelog (npm run changelog-next for a release)
# Only commits with a bracket tag [FEAT]/[FEATURE] / [FIX]/[BUGFIX] / [DEV] / [BREAKING] are listed

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
It is generated from the commit history by [git-cliff](https://git-cliff.org) - do not edit manually.
{% for release in releases %}{% if loop.first %}
A list of unreleased changes can be found [here](https://github.com/treee111/wahooMapsCreator/compare/{{ release.version | default(value=release.previous.version) }}...HEAD).
{% endif %}{% endfor %}
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\\n") | first | split(pat="] ") | slice(start=1) | join(sep="] ") | trim }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/treee111/wahooMapsCreator/commit/{{ commit.id }}))
{% endfor %}
{%- endfor %}
{% endif -%}
"""
trim = true

[git]
conventional_commits = false
filter_commits = true
# Walk commits by date (old develop -> production merges would mix up releases)
topo_order_commits = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
# Pre-releases (e.g. v4.2.1a1) are not listed, their commits go into the next release
ignore_tags = 'v[0-9.]+(a|b|rc)[0-9]+$'
commit_preprocessors = [
  # Turn the trailing "(#123)" into a PR link
  { pattern = '\s*\(#(\d+)\)', replace = " ([#${1}](https://github.com/treee111/wahooMapsCreator/pull/${1}))" },
]
commit_parsers = [
  { message = '^\[BREAKING\]', group = "<!-- 0 -->Breaking Changes" },
  { message = '^\[(FEAT|FEATURE)\]', group = "<!-- 1 -->Features" },
  { message = '^\[(FIX|BUGFIX)\]', group = "<!-- 2 -->Bug Fixes" },
  { message = '^\[DEV\]', group = "<!-- 3 -->Development/Infrastructure/Test/CI" },
]
